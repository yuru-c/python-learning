[project]
name = "python-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuru-c", email = "shannon0137@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cowsay>=6.1",
    "emoji>=2.15.0",
    "fpdf2>=2.8.8",
    "inflect>=7.5.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pyfiglet>=1.0.4",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "tabulate>=0.10.0",
    "validator-collection>=1.5.0",
    "validators>=0.35.0",
]

[project.scripts]
python-learning = "python_learning:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[tool.uv.workspace]
members = [
    "ml-training/numpy",
]
